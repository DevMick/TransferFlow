name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '10'

      - name: Get pnpm store directory
        run: echo "PNPM_HOME=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.PNPM_HOME }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          VITE_API_URL: https://transfertsecur.com

      - name: Test
        run: pnpm test

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SCRIPT='
            cd /var/www/transfertsecur.com/app
            git fetch origin main
            git checkout main
            git pull origin main
            pnpm install --frozen-lockfile
            export VITE_API_URL=https://transfertsecur.com
            pnpm build
            pnpm db:migrate
            sudo systemctl restart transferflow-api
          '

          # The VPS's network path occasionally has a transient TCP dial
          # timeout from GitHub-hosted runners; retry a few times before
          # failing the deploy outright.
          max_attempts=5
          attempt=1
          until ssh -i ~/.ssh/deploy_key -o ConnectTimeout=20 -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "$SCRIPT"; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "SSH deploy failed after $max_attempts attempts"
              exit 1
            fi
            echo "Attempt $attempt failed, retrying in 15s..."
            attempt=$((attempt + 1))
            sleep 15
          done

      - name: Verify deployment
        run: |
          # Le service peut prendre plus de 5s pour redémarrer complètement ;
          # on retente avant d'échouer pour éviter les faux négatifs.
          max_attempts=6
          attempt=1
          until curl -f https://transfertsecur.com/api/health; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Health check failed after $max_attempts attempts"
              exit 1
            fi
            echo "Attempt $attempt failed, retrying in 10s..."
            attempt=$((attempt + 1))
            sleep 10
          done
          curl -f https://transfertsecur.com || exit 1

      - name: Notify deployment success
        if: success()
        run: echo "✅ Deployment successful - TransferFlow is now live"

      - name: Notify deployment failure
        if: failure()
        run: echo "❌ Deployment failed - Check logs for details"
