name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '10'

      - name: Get pnpm store directory
        run: echo "PNPM_HOME=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.PNPM_HOME }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          VITE_API_URL: https://transfertsecur.com

      - name: Test
        run: pnpm test

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/transfertsecur.com/app
            git fetch origin main
            git checkout main
            git pull origin main
            pnpm install --frozen-lockfile
            export VITE_API_URL=https://transfertsecur.com
            pnpm build
            pnpm db:migrate
            sudo systemctl restart transferflow-api

      - name: Verify deployment
        run: |
          sleep 5
          curl -f https://transfertsecur.com || exit 1
          curl -f https://transfertsecur.com/api/health || exit 1

      - name: Notify deployment success
        if: success()
        run: echo "✅ Deployment successful - TransferFlow is now live"

      - name: Notify deployment failure
        if: failure()
        run: echo "❌ Deployment failed - Check logs for details"
