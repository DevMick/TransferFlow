services:
  postgres:
    image: postgres:17-alpine
    container_name: transferflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: transferflow
      POSTGRES_PASSWORD: transferflow
      POSTGRES_DB: transferflow
    ports:
      - "5432:5432"
    volumes:
      - transferflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transferflow -d transferflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  transferflow-pgdata:
